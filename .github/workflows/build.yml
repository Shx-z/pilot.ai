name: Build Pilot.AI (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Swift Package
        run: |
          swift build -c release

      - name: Package Payload to .ipa
        run: |
          mkdir -p build/Payload/Pilot.app
          cp -r .build/release/* build/Payload/Pilot.app/ 2>/dev/null || true
          cd build && zip -r Pilot.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pilot-IPA
          path: build/Pilot.ipa
