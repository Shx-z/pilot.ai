name: Build Pilot.AI (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS Package
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release --triple arm64-apple-ios17.0 -Xswiftc -sdk -Xswiftc "$SDK_PATH"

      - name: Create Payload and Package .ipa
        run: |
          mkdir -p build/Payload/Pilot.app
          find .build -name "PilotAI" -type f -exec cp {} build/Payload/Pilot.app/ \; 2>/dev/null || true
          cp -r PilotAI/Resources/* build/Payload/Pilot.app/ 2>/dev/null || true
          cd build && zip -r Pilot.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pilot-IPA
          path: build/Pilot.ipa
