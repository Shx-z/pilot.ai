name: Build Pilot.AI (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS arm64 App with Xcode
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/Payload/Pilot.app
          swiftc -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -o build/Payload/Pilot.app/Pilot \
            $(find PilotAI -name "*.swift") || xcodebuild -project PilotAI.xcodeproj -scheme PilotAI -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to .ipa
        run: |
          cp -r PilotAI/Resources/* build/Payload/Pilot.app/ 2>/dev/null || true
          cd build && zip -r Pilot.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pilot-IPA
          path: build/Pilot.ipa
